services:
  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realestate_scraper
    command: python -m cli --city-scan --cities utrecht --sources funda,parariusvesteda,rebo,kamernet,regioamsterdam,regioutrecht,regiogroningen,regiogooienvecht,regioalmere,regiomiddenholland,regioeemvallei,regiobovengroningen,regiowoonkeus,regiowoongaard,regiohuiswaarts,huurwoningenkamer,huurwoningenstudio,huurwoningenappartement,huurwoningenhuis,bouwinvest,vbt,123wonen,hollandrijnland
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-realestate}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - realestate_network

  telegram:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realestate_telegram
    command: python -m main_telegram
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-realestate}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - realestate_network

  db:
    image: postgres:18
    container_name: realestate_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-realestate}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-realestate}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - realestate_network

volumes:
  db_data:

networks:
  realestate_network:
    driver: bridge
